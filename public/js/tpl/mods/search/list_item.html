<td style="overflow-wrap: anywhere;">
  <strong><a href="<%-link%>" target=_blank rel="noopener noreferrer"><%-title%></a></strong>
  <% if (obj.description) { %>
    <div class="small text-muted" style="margin-top: 5px;"><%-obj.description%></div>
  <% } %>
</td>
<td class="text-right" style="width: 1%; white-space: nowrap;">
  <% if (downloading()) { %>
    <div class="progress" style="margin-bottom: 0; min-width: 70px;">
      <div class="progress-bar progress-bar-striped active" role="progressbar" style="width: 100%"></div>
    </div>
  <% } else { %>
    <a class="btn btn-primary btn-xs install ladda-button" data-style="expand-left">
      <span class="glyphicon glyphicon-save"></span>
      Install
    </a>
  <% } %>
  <% if (obj.fileSizeFormatted) { %>
    <div class="small text-muted" style="margin-top: 5px;"><%-obj.fileSizeFormatted%></div>
  <% } %>
  <% if (obj.subscriptions) { %>
    <div class="small text-muted"><%-obj.subscriptions.toLocaleString()%> subscribers</div>
  <% } %>
</td>
