<a class="btn btn-primary" id="refresh" href="#">
  <span class="glyphicon glyphicon-refresh"></span>
  Refresh
</a>

<span class="workshop-actions" <% if (!workshop) { %>style="display: none;"<% } %>>
  <a class="btn btn-primary" id="download" href="#">
    <span class="glyphicon glyphicon-search"></span>
    Download specific mod
  </a>

  <a class="btn btn-primary" id="search" href="#">
    <span class="glyphicon glyphicon-search"></span>
    Search &amp; Download
  </a>
</span>

<form>
  <div class="form-group">
    <label for="filterMods">Filter</label>
    <input type="text" class="form-control" id="filterMods" placeholder="Filter mods..." value="<%-filterValue%>">
  </div>
</form>

<div id="list"></div>
